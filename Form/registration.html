<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration form </title>
        <link rel="stylesheet" href="./registration.css">
    </head>
    <body>
        <form>
            <label for="firstName">First name:</label>
            <input type="text" id="firstName" name="firstName" required><br>            <label for="lastName">Last name:</label>
            <input type="text" id="lastName" name="lastName" required><br>            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                placeholder="you@example.com" required><br>            <label for="birthday">Birthday:</label>
            <input type="date" id="birthday" name="birthday"><br>            <label>Country</label>
            <select id="country">
                <option value="none">None</option>
                <option value="eritrea">Eritrea</option>
                <option value="uganda">Uganda</option>
                <option value="kenya">Kenya</option>
            </select><br>           <label>Gender: </label>
            <label>
                <input type="radio" name="gender" value="male">Male
            </label>
            <label>
                <input type="radio" name="gender" value="female">Female
            </label>
            <br>           <label>Phone</label>
            <input type="tel" pattern="[+][0-9]{3}[0-9]{9}" required
                placeholder="+251901020304"> <br>           <label>Address</label>
            <input type="text" name="address" required>
        </label>
        <br>        <!-- <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br> -->

        <button>Register</button>
    </body>
</html>
